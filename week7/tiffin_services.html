<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiffin Services</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }
        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 2.2rem;
        }
        p {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #f8fafc;
            font-size: 1rem;
        }
        button {
            margin-top: 14px;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .stats {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-top: 24px;
        }
        .stat-card {
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            text-align: center;
        }
        .stat-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .table-wrapper {
            margin-top: 28px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background: #f1f5f9;
            font-weight: 700;
        }
        .delete-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #b91c1c;
        }
        .empty-row td {
            text-align: center;
            color: #6b7280;
            padding: 28px 0;
        }
        @media (max-width: 760px) {
            .grid,
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tiffin Services</h1>
        <p>Manage tiffin orders, menu plans, delivery type, and cost with a simple interface.</p>

        <div class="grid">
            <div>
                <label for="customerName">Customer Name</label>
                <input id="customerName" type="text" placeholder="Enter customer name" />
            </div>
            <div>
                <label for="customerPhone">Phone Number</label>
                <input id="customerPhone" type="text" placeholder="Enter phone number" />
            </div>
            <div>
                <label for="tiffinPlan">Tiffin Plan</label>
                <select id="tiffinPlan">
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Non-Vegetarian">Non-Vegetarian</option>
                    <option value="Deluxe">Deluxe</option>
                    <option value="Custom">Custom</option>
                </select>
            </div>
            <div>
                <label for="deliveryType">Delivery Type</label>
                <select id="deliveryType">
                    <option value="Pickup">Pickup</option>
                    <option value="Home Delivery">Home Delivery</option>
                </select>
            </div>
            <div>
                <label for="mealCount">Meals per Day</label>
                <input id="mealCount" type="number" min="1" value="1" />
            </div>
            <div>
                <label for="pricePerMeal">Price per Meal</label>
                <input id="pricePerMeal" type="number" min="0" value="50" />
            </div>
        </div>
        <button id="addOrder">Add Order</button>

        <div class="stats">
            <div class="stat-card">
                <strong id="totalOrders">0</strong>
                Total Orders
            </div>
            <div class="stat-card">
                <strong id="totalMeals">0</strong>
                Total Meals
            </div>
            <div class="stat-card">
                <strong id="totalRevenue">₹0</strong>
                Total Revenue
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Plan</th>
                        <th>Delivery</th>
                        <th>Meals</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr class="empty-row">
                        <td colspan="7">No orders yet. Add a new tiffin order to start.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const customerName = document.getElementById('customerName');
        const customerPhone = document.getElementById('customerPhone');
        const tiffinPlan = document.getElementById('tiffinPlan');
        const deliveryType = document.getElementById('deliveryType');
        const mealCount = document.getElementById('mealCount');
        const pricePerMeal = document.getElementById('pricePerMeal');
        const addOrder = document.getElementById('addOrder');
        const ordersTable = document.getElementById('ordersTable');
        const totalOrders = document.getElementById('totalOrders');
        const totalMeals = document.getElementById('totalMeals');
        const totalRevenue = document.getElementById('totalRevenue');

        const orders = [];

        function renderOrders() {
            ordersTable.innerHTML = '';
            if (orders.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.className = 'empty-row';
                emptyRow.innerHTML = '<td colspan="7">No orders yet. Add a new tiffin order to start.</td>';
                ordersTable.appendChild(emptyRow);
                return;
            }

            orders.forEach((order, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.customer}</td>
                    <td>${order.phone}</td>
                    <td>${order.plan}</td>
                    <td>${order.delivery}</td>
                    <td>${order.meals}</td>
                    <td>₹${order.amount}</td>
                    <td><button class="delete-btn" data-index="${index}">Delete</button></td>
                `;
                ordersTable.appendChild(row);
            });

            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const index = Number(button.dataset.index);
                    orders.splice(index, 1);
                    renderOrders();
                    updateStats();
                });
            });
        }

        function updateStats() {
            const total = orders.length;
            const meals = orders.reduce((sum, order) => sum + Number(order.meals), 0);
            const revenue = orders.reduce((sum, order) => sum + Number(order.amount), 0);
            totalOrders.textContent = total;
            totalMeals.textContent = meals;
            totalRevenue.textContent = `₹${revenue}`;
        }

        addOrder.addEventListener('click', () => {
            const customer = customerName.value.trim();
            const phone = customerPhone.value.trim();
            const plan = tiffinPlan.value;
            const delivery = deliveryType.value;
            const meals = Number(mealCount.value);
            const price = Number(pricePerMeal.value);

            if (!customer || !phone || meals <= 0 || price < 0) {
                alert('Please complete all fields with valid values before adding the order.');
                return;
            }

            const amount = meals * price;
            orders.push({ customer, phone, plan, delivery, meals, amount });

            customerName.value = '';
            customerPhone.value = '';
            tiffinPlan.value = 'Vegetarian';
            deliveryType.value = 'Pickup';
            mealCount.value = 1;
            pricePerMeal.value = 50;

            renderOrders();
            updateStats();
        });

        renderOrders();
        updateStats();
    </script>
</body>
</html>
