<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 2rem;
        }
        .status {
            text-align: center;
            margin-bottom: 18px;
            font-size: 1.1rem;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .square {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
        }
        .square.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .square span {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #111827;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            justify-content: center;
        }
        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div id="root" class="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
        const { useState } = React;

        function calculateWinner(board) {
            const lines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6],
            ];

            for (const [a, b, c] of lines) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }

        function Square({ value, onClick, disabled }) {
            return (
                React.createElement('button', {
                    className: `square${disabled ? ' disabled' : ''}`,
                    onClick,
                    disabled,
                    type: 'button'
                }, React.createElement('span', null, value))
            );
        }

        function Board({ squares, onSquareClick }) {
            return React.createElement('div', { className: 'board' },
                squares.map((square, index) =>
                    React.createElement(Square, {
                        key: index,
                        value: square,
                        onClick: () => onSquareClick(index),
                        disabled: Boolean(square)
                    })
                )
            );
        }

        function App() {
            const [board, setBoard] = useState(Array(9).fill(null));
            const [xIsNext, setXIsNext] = useState(true);
            const winner = calculateWinner(board);
            const isDraw = !winner && board.every(Boolean);
            const status = winner
                ? `Winner: ${winner}`
                : isDraw
                    ? 'Draw!'
                    : `Next player: ${xIsNext ? 'X' : 'O'}`;

            function handleSquareClick(index) {
                if (board[index] || winner) return;
                const nextBoard = board.slice();
                nextBoard[index] = xIsNext ? 'X' : 'O';
                setBoard(nextBoard);
                setXIsNext(!xIsNext);
            }

            function resetBoard() {
                setBoard(Array(9).fill(null));
                setXIsNext(true);
            }

            return React.createElement(React.Fragment, null,
                React.createElement('h1', null, 'React Tic Tac Toe'),
                React.createElement('div', { className: 'status' }, status),
                React.createElement(Board, { squares: board, onSquareClick: handleSquareClick }),
                React.createElement('div', { className: 'actions' },
                    React.createElement('button', { onClick: resetBoard, type: 'button' }, 'Restart Game')
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
