<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Management System</title>
    <link rel="stylesheet" href="cm.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Canteen Management System</h1>
        </header>

        <div class="main-content">
            <!-- Menu Section -->
            <section class="menu-section">
                <h2>Menu</h2>
                <div class="food-items">
                    <div class="food-card">
                        <h3>Burger</h3>
                        <p class="price">₹100</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                    <div class="food-card">
                        <h3>Pizza</h3>
                        <p class="price">₹200</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                    <div class="food-card">
                        <h3>Biryani</h3>
                        <p class="price">₹150</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                    <div class="food-card">
                        <h3>Samosa</h3>
                        <p class="price">₹20</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                </div>
            </section>

            <!-- Cart Section -->
            <section class="cart-section">
                <h2>Your Cart</h2>
                <div class="cart-items">
                    <p class="empty-message">Your cart is empty</p>
                </div>
                <div class="cart-footer">
                    <p class="total">Total: ₹0</p>
                    <button class="checkout-btn">Checkout</button>
                </div>
            </section>
        </div>

        <footer>
            <p>&copy; 2026 Canteen Management System</p>
        </footer>
    </div>
</body>
</html>
